name: Deploy YatraSathi to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd ~/YatraSathi2
            git pull origin main
            npm install
            pm2 restart yatrasathi-backend

            cd frontend
            npm install
            npm run build
            sudo systemctl restart nginx
